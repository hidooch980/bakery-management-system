<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="loaf" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#FFF6E4"/>
      <stop offset="42%" stop-color="#F6DCAF"/>
      <stop offset="100%" stop-color="#E0B268"/>
    </linearGradient>
  </defs>

  <!-- Android crops adaptive icons to ~66% of the canvas, so the loaf is
       scaled down and centred to survive every mask shape. -->
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <ellipse cx="256" cy="256" rx="146" ry="118" fill="url(#loaf)"/>
    <ellipse cx="256" cy="256" rx="146" ry="118" fill="none"
             stroke="#C98B33" stroke-width="7" opacity="0.55"/>

    <g stroke="#B0731F" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M176 214 C 192 240, 192 272, 176 298"/>
      <path d="M256 198 C 274 232, 274 280, 256 314"/>
      <path d="M336 214 C 320 240, 320 272, 336 298"/>
    </g>

    <g fill="#FFFFFF" opacity="0.95">
      <ellipse cx="212" cy="180" rx="8" ry="5" transform="rotate(-24 212 180)"/>
      <ellipse cx="298" cy="184" rx="8" ry="5" transform="rotate(20 298 184)"/>
      <ellipse cx="256" cy="166" rx="8" ry="5"/>
      <ellipse cx="158" cy="246" rx="8" ry="5" transform="rotate(-70 158 246)"/>
      <ellipse cx="354" cy="246" rx="8" ry="5" transform="rotate(70 354 246)"/>
      <ellipse cx="206" cy="330" rx="8" ry="5" transform="rotate(14 206 330)"/>
      <ellipse cx="306" cy="330" rx="8" ry="5" transform="rotate(-14 306 330)"/>
      <ellipse cx="256" cy="346" rx="8" ry="5"/>
    </g>
  </g>
</svg>
