<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!--
      The kiln, seen from the front: iron ground, and the loaf lit by the
      fire behind it.

      The old icon put a pale loaf on amber. Both were warm and close in
      value, so at launcher size the whole thing collapsed into one brown
      shape and the wheat at the bottom disappeared entirely. This one
      keeps the shop's own palette but spends it where it counts — dark
      ground, bright bread — so the silhouette survives being 48 pixels on
      a crowded home screen.
    -->
    <linearGradient id="iron" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2A2F3A"/>
      <stop offset="55%" stop-color="#12161C"/>
      <stop offset="100%" stop-color="#0B0E13"/>
    </linearGradient>

    <!-- The ember ramp the app itself uses for every reading. -->
    <radialGradient id="fire" cx="0.5" cy="0.78" r="0.62">
      <stop offset="0%" stop-color="#E8952D" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#C24A16" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7A1F12" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="crust" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F5D08A"/>
      <stop offset="45%" stop-color="#E8952D"/>
      <stop offset="100%" stop-color="#C24A16"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#iron)"/>
  <rect width="512" height="512" rx="112" fill="url(#fire)"/>

  <!--
    The oven mouth. An arch rather than a rectangle, because that is what
    a bread oven looks like from the floor, and because the curve reads as
    a shape at small sizes where a thin rectangle reads as a smudge.
  -->
  <path d="M104 288 A152 152 0 0 1 408 288 L408 396 L104 396 Z"
        fill="none" stroke="#3A424F" stroke-width="14" stroke-linejoin="round"/>

  <!-- The loaf, sitting on the oven floor. -->
  <ellipse cx="256" cy="272" rx="126" ry="92" fill="url(#crust)"/>

  <!--
    Three slashes, the way a shater scores a loaf before it goes in. Kept
    thick and few: at launcher size anything finer turns to noise.
  -->
  <g stroke="#7A1F12" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.72">
    <path d="M194 234 A50 50 0 0 1 194 312"/>
    <path d="M256 222 A54 54 0 0 1 256 324"/>
    <path d="M318 234 A50 50 0 0 1 318 312"/>
  </g>

  <!-- The oven floor, and the ember line under it. -->
  <rect x="104" y="390" width="304" height="16" rx="8" fill="#3A424F"/>
  <rect x="142" y="428" width="228" height="12" rx="6" fill="#C24A16" opacity="0.85"/>
  <rect x="192" y="458" width="128" height="10" rx="5" fill="#E8952D" opacity="0.6"/>
</svg>
