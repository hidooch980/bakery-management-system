name: bakery_app
description: اپلیکیشن مدیریت نانوایی — ثبت خمیر، چانه، فروش و حضور و غیاب
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Local persistence for the auth token and theme preference
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # In-app update: read current version, download and open the new APK
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0

  # UI
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  intl: ^0.20.2

  # Jalali (Hijri Shamsi) calendar
  shamsi_date: ^1.0.4

  # Deep-links to the Android install-permission settings page
  android_intent_plus: ^5.2.0
  device_info_plus: ^11.2.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  local_auth_platform_interface: ^1.1.0

# Generates every Android density from the bakery loaf artwork, replacing
# the default Flutter logo.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#C2761A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
