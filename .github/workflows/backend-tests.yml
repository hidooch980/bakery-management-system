name: Backend Tests

on:
  # On main: every push, with no path filter.
  #
  # There used to be one, and it read as common sense — why run the PHP
  # suite when only the Flutter app changed? Because main after a merge is
  # a *state*, not a diff. Five tests in SellerAccountTest were failing on
  # main for two days while the shop ran that code, and the runs that
  # would have caught it never fired: 4681fc1 touched only mobile-app/, so
  # Backend Tests was skipped, and a skipped check is reported as a green
  # tick beside the commit. It reads exactly like a pass.
  #
  # The suite costs four minutes. Two days of a bakery selling one batch
  # of bread to two people costs more.
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bakery_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, curl, zip, gd, intl, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      # Cheap and fails fast, so a formatting drift is caught before the
      # database is even up.
      - name: Check formatting
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bakery_db_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
