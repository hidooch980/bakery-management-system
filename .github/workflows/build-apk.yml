name: Build & Release APK

# A push to main builds a testable APK. A tag (v1.0.0) also cuts the GitHub
# release that the app's in-app updater looks for — the APK must be signed
# with the same keystore every time, or Android refuses the update as a
# different app, and it must carry the real server URL, or it installs fine
# and then fails every request.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'آدرس API سرور (خالی بگذارید تا از متغیر API_BASE_URL مخزن استفاده شود)'
        required: false
        default: ''
      release_tag:
        description: 'تگ انتشار (خالی بگذارید تا فقط بیلد شود بدون انتشار)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve API base URL
        id: config
        run: |
          # A tag build has no form input. It must NOT fall back to
          # 10.0.2.2 — that is the emulator's alias for its host machine and
          # is unreachable from a real phone, so the APK would install fine
          # and then fail every request with a connection error.
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.API_BASE_URL }}"
          fi

          if [ -z "$URL" ]; then
            echo "::error::No API base URL. Set the API_BASE_URL repository variable, or supply one when running the workflow by hand."
            exit 1
          fi

          case "$URL" in
            *10.0.2.2*|*localhost*|*127.0.0.1*)
              # These only resolve on the build machine or an emulator.
              echo "::error::API base URL '$URL' is not reachable from a real device."
              exit 1
              ;;
          esac

          echo "Building against $URL"
          echo "api_base_url=$URL" >> "$GITHUB_OUTPUT"

          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          # Strip the leading "v" so it can be written into pubspec.yaml.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Sync pubspec version with the release tag
        if: steps.config.outputs.version != ''
        working-directory: mobile-app
        run: |
          # The in-app updater compares this against the GitHub release tag.
          # Offset past the abi*1000 codes the withdrawn per-ABI builds used
          # (up to 3000+), so phones holding one can still be updated.
          BUILD_NUMBER=$(( 10000 + ${{ github.run_number }} ))
          sed -i "s/^version: .*/version: ${{ steps.config.outputs.version }}+$BUILD_NUMBER/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Restore release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Every release must be signed with the same key, or Android rejects
          # the update with "package conflicts with an existing package".
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — the APK would be signed with a throwaway debug key and could not be installed as an update."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      # The output is echoed back as GitHub error annotations, which are
      # readable without a token. Without this the run reports only
      # "Process completed with exit code 1" and the reason lives in a log
      # nobody outside the repo can open -- which cost three blind guesses
      # and three round trips in one afternoon.
      - name: Analyze
        working-directory: mobile-app
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Every line, unfiltered. A pattern that misses is worse than
            # no pattern: it reports nothing and looks like it worked.
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::${line}"
            done < <(head -40 /tmp/analyze.txt)
          fi
          exit "$status"

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build APK
        working-directory: mobile-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # One APK covering every CPU. Per-ABI splits were tried and
          # withdrawn: Flutter gives each split a versionCode of
          # abi * 1000 + base, so a phone that installed the arm64 file
          # could never install a universal one again — Android reads the
          # lower versionCode as a downgrade and refuses it.
          #
          # Two ARM targets rather than three platforms: x86_64 is emulators
          # and a handful of Chromebooks, none of which are in the shop, and
          # it was a third of the native payload. Staff download this over
          # mobile data, so the size is a cost they actually pay.
          #
          # No --obfuscate. It went out in v4.42.0 and came back off: the
          # few megabytes it saved were not worth a build whose failures
          # only appear once it is on a staff phone, mid-shift, and which
          # cannot be read without the symbol file from that exact build.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE_URL=${{ steps.config.outputs.api_base_url }} \
            --dart-define=UPDATE_REPO=${{ github.repository }}

          echo "APK size: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"

      - name: Verify the APK is signed with the release key
        working-directory: mobile-app
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | tee /tmp/certs.txt

          # A debug-signed APK would break in-app updates, so fail loudly here.
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK was signed with the debug key — in-app updates would fail."
            exit 1
          fi

      - name: Rename APK
        id: apk
        working-directory: mobile-app
        run: |
          SRC=build/app/outputs/flutter-apk/app-release.apk
          TAG="${{ steps.config.outputs.release_tag }}"
          NAME="bakery-app${TAG:+-$TAG}.apk"
          cp "$SRC" "$NAME"
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=mobile-app/$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakery-app-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.config.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.release_tag }}
          name: نسخه ${{ steps.config.outputs.release_tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            ## 📱 اپلیکیشن مدیریت نانوایی

            **نسخه:** ${{ steps.config.outputs.release_tag }}
            **آدرس API این بیلد:** `${{ steps.config.outputs.api_base_url }}`

            ### ⚠️ اگر «برنامه نصب نشد» دیدید
            **گوشی‌هایی که نسخه v1.0.0 یا v1.1.0 روی آن‌ها نصب است، باید اول برنامه را حذف کنند.**
            آن دو نسخه پیش از تعریف کلید امضای ثابت ساخته شده بودند و اندروید اجازه نمی‌دهد
            برنامه‌ای با کلید متفاوت روی آن‌ها نصب شود. این یک قانون امنیتی اندروید است و
            راه دیگری ندارد.

            ۱. برنامه را از گوشی حذف کنید ۲. این فایل را نصب کنید

            اطلاعات روی سرور است و از بین نمی‌رود؛ فقط باید دوباره وارد شوید.
            از نسخه v1.2.0 به بعد، همه نسخه‌ها با یک کلید امضا می‌شوند و به‌روزرسانی
            بدون حذف انجام می‌شود.

            ### نصب
            **حداقل اندروید ۷ (Nougat) لازم است.**

            یک فایل برای همه گوشی‌ها: `${{ steps.apk.outputs.name }}`

            هنگام نصب، اجازه «نصب برنامه‌های ناشناس» را برای مرورگر یا فایل‌منیجر فعال کنید.

            > **اگر نسخه v4.12.0 یا v4.13.0 را با فایل `-arm64-v8a` یا `-armeabi-v7a` نصب کرده‌اید:**
            > آن دو نسخه به اشتباه با چند فایل جداگانه منتشر شدند و کد نسخه‌شان بالاتر از
            > حد معمول بود. یک‌بار برنامه را حذف کنید و این فایل را نصب کنید؛ از این پس
            > همیشه یک فایل واحد منتشر می‌شود و به‌روزرسانی بدون حذف انجام می‌شود.

            > **اگر پیام «Blocked by Play Protect» یا «برنامه مسدود شد» دیدید:**
            > روی «More details» و سپس «Install anyway» بزنید. این پیام برای همه
            > برنامه‌هایی که از گوگل‌پلی نیامده‌اند ظاهر می‌شود و ربطی به سالم بودن فایل ندارد.

            ### به‌روزرسانی خودکار
            نسخه‌های بعدی از داخل خود برنامه قابل نصب هستند:
            **تنظیمات ← به‌روزرسانی برنامه ← دانلود و نصب**
