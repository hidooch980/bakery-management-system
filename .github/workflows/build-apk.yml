name: Build & Release APK

# Push a tag (v1.0.0) to cut a release, or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'آدرس API سرور (مثلاً http://185.97.119.91:8000/api/v1)'
        required: false
        default: 'http://10.0.2.2:8000/api/v1'
      release_tag:
        description: 'تگ انتشار (خالی بگذارید تا فقط بیلد شود بدون انتشار)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve API base URL
        id: config
        run: |
          # Tag builds have no form input, so fall back to the emulator default.
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="http://10.0.2.2:8000/api/v1"
          fi
          echo "api_base_url=$URL" >> "$GITHUB_OUTPUT"

          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          # Strip the leading "v" so it can be written into pubspec.yaml.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Sync pubspec version with the release tag
        if: steps.config.outputs.version != ''
        working-directory: mobile-app
        run: |
          # The in-app updater compares this against the GitHub release tag.
          sed -i "s/^version: .*/version: ${{ steps.config.outputs.version }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build APK
        working-directory: mobile-app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.config.outputs.api_base_url }} \
            --dart-define=UPDATE_REPO=${{ github.repository }}

      - name: Rename APK
        id: apk
        working-directory: mobile-app
        run: |
          SRC=build/app/outputs/flutter-apk/app-release.apk
          TAG="${{ steps.config.outputs.release_tag }}"
          NAME="bakery-app${TAG:+-$TAG}.apk"
          cp "$SRC" "$NAME"
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=mobile-app/$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakery-app-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.config.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.release_tag }}
          name: نسخه ${{ steps.config.outputs.release_tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            ## 📱 اپلیکیشن مدیریت نانوایی

            **نسخه:** ${{ steps.config.outputs.release_tag }}
            **آدرس API این بیلد:** `${{ steps.config.outputs.api_base_url }}`

            ### نصب
            فایل `${{ steps.apk.outputs.name }}` را دانلود و روی گوشی اندروید نصب کنید.
            هنگام نصب، اجازه «نصب برنامه‌های ناشناس» را برای مرورگر یا فایل‌منیجر فعال کنید.

            ### به‌روزرسانی خودکار
            نسخه‌های بعدی از داخل خود برنامه قابل نصب هستند:
            **تنظیمات ← به‌روزرسانی برنامه ← دانلود و نصب**
