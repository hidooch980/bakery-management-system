name: Build & Release APK

# A push to main builds a testable APK. A tag (v1.0.0) also cuts the GitHub
# release that the app's in-app updater looks for — the APK must be signed
# with the same keystore every time, or Android refuses the update as a
# different app, and it must carry the real server URL, or it installs fine
# and then fails every request.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'آدرس API سرور (خالی بگذارید تا از متغیر API_BASE_URL مخزن استفاده شود)'
        required: false
        default: ''
      release_tag:
        description: 'تگ انتشار (خالی بگذارید تا فقط بیلد شود بدون انتشار)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags, not just the commit. An untagged build names itself after
          # the last release (see the stamping step), and the default
          # shallow checkout brings none.
          fetch-tags: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve API base URL
        id: config
        run: |
          # A tag build has no form input. It must NOT fall back to
          # 10.0.2.2 — that is the emulator's alias for its host machine and
          # is unreachable from a real phone, so the APK would install fine
          # and then fail every request with a connection error.
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.API_BASE_URL }}"
          fi

          if [ -z "$URL" ]; then
            echo "::error::No API base URL. Set the API_BASE_URL repository variable, or supply one when running the workflow by hand."
            exit 1
          fi

          case "$URL" in
            *10.0.2.2*|*localhost*|*127.0.0.1*)
              # These only resolve on the build machine or an emulator.
              echo "::error::API base URL '$URL' is not reachable from a real device."
              exit 1
              ;;
          esac

          echo "Building against $URL"
          echo "api_base_url=$URL" >> "$GITHUB_OUTPUT"

          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          # Strip the leading "v" so it can be written into pubspec.yaml.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version this build carries
        working-directory: mobile-app
        run: |
          # Two halves, and only one of them depends on there being a tag.
          #
          # The build number is the versionCode Android installs by, and it
          # must rise with every build this workflow publishes. It used to
          # be set only when a release tag was given, so an untagged run
          # left `pubspec.yaml` at its checked-in `+1` and produced an APK
          # with versionCode 1 — which no phone holding a real release can
          # install, because Android reads a lower code as a downgrade and
          # refuses it. Nothing said so: the build was green, the artifact
          # was there, and the failure appeared as «برنامه نصب نشد» on a
          # handset with no reason given.
          #
          # Offset past the abi*1000 codes the withdrawn per-ABI builds
          # used (up to 3000+), so phones still holding one can be updated.
          BUILD_NUMBER=$(( 10000 + ${{ github.run_number }} ))

          # The version name is what the in-app updater compares against
          # the GitHub release tag — three numeric parts, build metadata
          # dropped. It is the tag when there is one.
          #
          # Without a tag it is the *last released* name, not the value
          # sitting in `pubspec.yaml`. That value is `1.0.0` and has been
          # for the life of the repository, and naming a build after it
          # wedges any phone it is installed on: the handset then reports
          # 1.0.0, the updater reads the real 4.87.0 release as newer and
          # offers it for ever, and Android refuses that install because
          # its versionCode is lower than the build already there. The way
          # out is uninstalling the app — which takes the offline queue,
          # and the unsent sales in it, with it.
          #
          # So a test build carries the released name and a higher build
          # number. The two are told apart by that number rather than by
          # the name, which is the price of the phone staying usable.
          NAME="${{ steps.config.outputs.version }}"

          if [ -z "$NAME" ]; then
            LAST=$(git tag --list 'v*' --sort=-v:refname | head -1)
            NAME="${LAST#v}"
          fi

          # No tags at all — a fresh fork, or the very first build.
          if [ -z "$NAME" ]; then
            NAME=$(grep '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d+ -f1)
          fi

          sed -i "s/^version: .*/version: $NAME+$BUILD_NUMBER/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Restore release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Every release must be signed with the same key, or Android rejects
          # the update with "package conflicts with an existing package".
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — the APK would be signed with a throwaway debug key and could not be installed as an update."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      # The reason, as GitHub error annotations, which are readable without
      # a token. Left to itself the run says only "Process completed with
      # exit code 1" and the cause sits in a log outsiders cannot open.
      #
      # Findings only, and few of them: `flutter analyze` resolves packages
      # first and prints a screenful of version numbers, GitHub keeps just
      # ten annotations per step, and the earlier attempts spent all ten on
      # that preamble. Analyzer findings carry a bullet, so match on that
      # and fall back to the last few lines if the shape ever changes.
      - name: Analyze
        working-directory: mobile-app
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            found=$(grep '•' /tmp/analyze.txt | tail -8)
            [ -z "$found" ] && found=$(tail -8 /tmp/analyze.txt)
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::${line}"
            done <<< "$found"
          fi
          exit "$status"

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build APK
        working-directory: mobile-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # One APK covering every CPU. Per-ABI splits were tried and
          # withdrawn: Flutter gives each split a versionCode of
          # abi * 1000 + base, so a phone that installed the arm64 file
          # could never install a universal one again — Android reads the
          # lower versionCode as a downgrade and refuses it.
          #
          # Two ARM targets rather than three platforms: x86_64 is emulators
          # and a handful of Chromebooks, none of which are in the shop, and
          # it was a third of the native payload. Staff download this over
          # mobile data, so the size is a cost they actually pay.
          #
          # No --obfuscate. It went out in v4.42.0 and came back off: the
          # few megabytes it saved were not worth a build whose failures
          # only appear once it is on a staff phone, mid-shift, and which
          # cannot be read without the symbol file from that exact build.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE_URL=${{ steps.config.outputs.api_base_url }} \
            --dart-define=UPDATE_REPO=${{ github.repository }}

          echo "APK size: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"

      - name: Verify the APK can actually be installed over a release
        working-directory: mobile-app
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          CODE=$("$AAPT2" dump badging build/app/outputs/flutter-apk/app-release.apk \
            | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+')

          echo "versionCode=$CODE"

          # The floor the stamping step guarantees. Below it, Android reads
          # the APK as a downgrade of anything already on a staff phone and
          # refuses to install it — with no reason shown on the handset.
          # This is checked here rather than trusted, because the symptom
          # appears at the far end of the chain: a green build, an artifact
          # that looks fine, and «برنامه نصب نشد» on a phone in the shop.
          if [ -z "$CODE" ] || [ "$CODE" -le 10000 ]; then
            echo "::error::versionCode $CODE is at or below the 10000 floor — this APK cannot be installed over an existing release."
            exit 1
          fi

      - name: Verify the APK is signed with the release key
        working-directory: mobile-app
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | tee /tmp/certs.txt

          # A debug-signed APK would break in-app updates, so fail loudly here.
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK was signed with the debug key — in-app updates would fail."
            exit 1
          fi

      - name: Rename APK
        id: apk
        working-directory: mobile-app
        run: |
          SRC=build/app/outputs/flutter-apk/app-release.apk
          TAG="${{ steps.config.outputs.release_tag }}"
          NAME="bakery-app${TAG:+-$TAG}.apk"
          cp "$SRC" "$NAME"
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=mobile-app/$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakery-app-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.config.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.release_tag }}
          name: نسخه ${{ steps.config.outputs.release_tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            ## 📱 اپلیکیشن مدیریت نانوایی

            **نسخه:** ${{ steps.config.outputs.release_tag }}
            **آدرس API این بیلد:** `${{ steps.config.outputs.api_base_url }}`

            ### ⚠️ اگر «برنامه نصب نشد» دیدید
            **گوشی‌هایی که نسخه v1.0.0 یا v1.1.0 روی آن‌ها نصب است، باید اول برنامه را حذف کنند.**
            آن دو نسخه پیش از تعریف کلید امضای ثابت ساخته شده بودند و اندروید اجازه نمی‌دهد
            برنامه‌ای با کلید متفاوت روی آن‌ها نصب شود. این یک قانون امنیتی اندروید است و
            راه دیگری ندارد.

            ۱. برنامه را از گوشی حذف کنید ۲. این فایل را نصب کنید

            اطلاعات روی سرور است و از بین نمی‌رود؛ فقط باید دوباره وارد شوید.
            از نسخه v1.2.0 به بعد، همه نسخه‌ها با یک کلید امضا می‌شوند و به‌روزرسانی
            بدون حذف انجام می‌شود.

            ### نصب
            **حداقل اندروید ۷ (Nougat) لازم است.**

            یک فایل برای همه گوشی‌ها: `${{ steps.apk.outputs.name }}`

            هنگام نصب، اجازه «نصب برنامه‌های ناشناس» را برای مرورگر یا فایل‌منیجر فعال کنید.

            > **اگر نسخه v4.12.0 یا v4.13.0 را با فایل `-arm64-v8a` یا `-armeabi-v7a` نصب کرده‌اید:**
            > آن دو نسخه به اشتباه با چند فایل جداگانه منتشر شدند و کد نسخه‌شان بالاتر از
            > حد معمول بود. یک‌بار برنامه را حذف کنید و این فایل را نصب کنید؛ از این پس
            > همیشه یک فایل واحد منتشر می‌شود و به‌روزرسانی بدون حذف انجام می‌شود.

            > **اگر پیام «Blocked by Play Protect» یا «برنامه مسدود شد» دیدید:**
            > روی «More details» و سپس «Install anyway» بزنید. این پیام برای همه
            > برنامه‌هایی که از گوگل‌پلی نیامده‌اند ظاهر می‌شود و ربطی به سالم بودن فایل ندارد.

            ### به‌روزرسانی خودکار
            نسخه‌های بعدی از داخل خود برنامه قابل نصب هستند:
            **تنظیمات ← به‌روزرسانی برنامه ← دانلود و نصب**
