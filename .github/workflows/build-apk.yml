name: Build Bakery APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"

jobs:

  build-apk:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-app

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      - name: Flutter Doctor
        run: flutter doctor


      - name: Install dependencies
        run: flutter pub get


      - name: Analyze
        run: flutter analyze || true


      - name: Build APK
        run: |
          flutter build apk --release


      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk bakery-management.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bakery-management-apk
          path: mobile-app/bakery-management.apk
          retention-days: 30
