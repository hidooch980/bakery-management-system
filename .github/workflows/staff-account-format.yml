name: آماده‌سازی بررسی پرونده کارکنان
on:
  workflow_dispatch:
  push:
    branches: [codex/staff-payroll-account]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, curl, zip, gd, intl, pdo_mysql
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-
      - name: آماده‌سازی وابستگی‌ها
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: بررسی و قالب‌بندی فایل‌های تغییرکرده
        working-directory: backend
        run: |
          ./vendor/bin/pint app/Http/Controllers/Api/StaffAccountController.php app/Http/Controllers/Api/SalaryController.php app/Models/SalaryPayment.php routes/api.php database/migrations/2026_10_07_180000_add_salary_recovery_choices.php tests/Feature/StaffAccountTest.php tests/Feature/BreadTakenHomeIsSettledAtMonthEndTest.php
          git diff --binary > /tmp/staff-account-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: staff-account-format
          path: /tmp/staff-account-format.patch
