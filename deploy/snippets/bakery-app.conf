# Everything that is the same whichever address the request arrived on.
#
# Pulled out of the server blocks when TLS was added: there are three of
# them now, and the failure this avoids is the quiet one — a root or a
# fastcgi timeout changed in the block somebody happened to be editing, so
# the shop behaves differently over HTTPS than over the IP and nobody knows
# why.

root /home/ubuntu/bakery-management-system/backend/public;
index index.php;

charset utf-8;
client_max_body_size 20M;

# ---- security headers, added 2026-08-17 ----
# The panel is the shop's whole till and ledger, and it was being served
# with nothing said about framing, sniffing or referrers.
#
# Here rather than in each server block, which is where the live server
# has been carrying them: written out twice, they are one edit away from
# the shop being protected over HTTPS and not over the IP the handsets
# actually use — and nothing would say so.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Version numbers tell an attacker which exploits to bother trying.
server_tokens off;

# nginx turns gzip on globally but leaves gzip_types at its default,
# which is text/html alone — every API answer was going out uncompressed
# over a phone connection. The reports are repetitive JSON and give up
# most of their size.
#
# gzip_min_length keeps it off the tiny answers, where the header costs
# more than the saving.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types application/json application/javascript text/css text/plain
           text/xml application/xml image/svg+xml;

# Filament ships its own assets; nginx answers for them rather than
# waking PHP for a stylesheet.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

error_page 404 /index.php;

location ~ \.php$ {
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_read_timeout 60;

    # So Laravel builds https:// links when the request arrived over TLS.
    # Without it every generated URL — a password-reset link, a redirect
    # out of the panel — comes back http and the browser is bounced back
    # through the redirect above, or refuses the mixed content outright.
    fastcgi_param HTTPS $https if_not_empty;
}

location ~ /\.(?!well-known).* { deny all; }
