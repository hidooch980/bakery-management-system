# The TLS half. Installed only once `certbot` has issued the certificate —
# nginx will not start while these files are missing, and an nginx that
# will not start is the shop shut.
#
# Installing this file also turns plain HTTP on `baker.molido.ir` into a
# redirect. It does not touch the IP: the handsets in the shop are still
# talking to `37.32.21.125` on ports 80 and 8000, and that block answers
# them exactly as before. Retiring it is a separate decision, taken when
# `server.json` has pointed at the name long enough that every phone has
# moved — see README.md.

server {
    # `listen ... http2` rather than the `http2 on;` directive: that one
    # arrived in nginx 1.25.1 and Ubuntu 24.04 ships 1.24, where it is not
    # an unsupported option but an unknown directive — nginx refuses to
    # start at all.
    listen 443 ssl http2;

    server_name baker.molido.ir;

    ssl_certificate     /etc/letsencrypt/live/baker.molido.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baker.molido.ir/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # No HSTS here, and not by oversight. HSTS tells every phone that has
    # ever succeeded to refuse plain HTTP to this name for months, and it
    # cannot be withdrawn by editing this file — the instruction is already
    # in the handset. It goes in once the certificate has renewed itself at
    # least once and the shop has run on the name for a week. Until then a
    # broken certificate is an afternoon's problem rather than a
    # fortnight's.

    include snippets/bakery-app.conf;
}

# The same name on port 80, now that there is somewhere to send it.
#
# Replaces the plain-HTTP block for this name in `nginx-bakery.conf`: put
# this file in place of that one's name block, or nginx has two server
# blocks for `baker.molido.ir:80` and ignores the second.
server {
    listen 80;

    server_name baker.molido.ir;

    # Still not redirected. Renewal fetches from here every sixty days, and
    # a redirect on this path is how a certificate silently stops renewing.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
