# The shop's backend, served by nginx and php-fpm rather than the built-in
# development server, which handles one request at a time and left five
# people on their phones queued behind whoever asked first.
#
# ---------------------------------------------------------------------
# This file is what the live server actually runs.
#
# It did not used to be. The repository described a deployment onto
# `baker.molido.ir` with certbot and an origin redirect; the shop was
# actually built on `baker.molido.shop` behind Arvan, by hand, on
# 2026-08-25. Following the old runbook would have copied a file with no
# TLS block and no security headers over a server that had both — taking
# the shop's certificate off in the name of installing one.
#
# So this is the deployed configuration, written down. Two things the
# server is missing are added and marked; see README.md for applying them.
# ---------------------------------------------------------------------

# ------------------------------------------------------- the IP, and all
#
# Everything that is not the name: the installed handsets, and Arvan's own
# connection to the origin. This is a `default_server`, so it answers for
# any host that is not matched below.
server {
    # 8000 is what the installed phones are built against and must keep
    # answering until they have all moved to a build that does not use it.
    listen 8000 default_server;

    # 80 as well. Iranian mobile networks drop connections to unusual ports,
    # so the shop worked on wifi and failed on Hamrah-e Aval and Irancell —
    # which reads as the server being down when it is answering fine.
    listen 80 default_server;

    server_name _;

    # MISSING ON THE LIVE SERVER — and this is the one that breaks quietly.
    #
    # Renewal fetches a file from here every sixty days. Without this block
    # the request falls through to Laravel and returns a 404 page, certbot
    # cannot prove the name, and the certificate simply stops renewing:
    # HTTPS works right up until the day it does not, which is a Friday
    # ninety days after issue and nothing anywhere warned.
    #
    # The block below (`deny all` on dotted paths) does let `.well-known`
    # through, but only as far as Laravel. This sends it to disk, where
    # certbot writes.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include snippets/bakery-app.conf;
}

# ------------------------------------------------------------------ TLS
#
# Added by hand on 2026-08-25. Arvan sits in front of this and was set to
# Full, meaning it tries to reach the origin over TLS. Nothing was
# listening on 443, so every https:// request to the shop returned 502
# while http:// was fine.
#
# Flexible would have fixed that in one click and left the Arvan-to-origin
# leg in clear text. This is the other way: a real certificate here, so the
# encryption reaches the shop rather than stopping at the CDN.
server {
    # `listen ... http2` rather than the `http2 on;` directive: that one
    # arrived in nginx 1.25.1 and Ubuntu 24.04 ships 1.24, where it is not
    # an unsupported option but an unknown directive — nginx refuses to
    # start at all.
    listen 443 ssl http2;

    server_name baker.molido.shop;

    ssl_certificate     /etc/letsencrypt/live/baker.molido.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baker.molido.shop/privkey.pem;

    # Written out rather than included from certbot's
    # options-ssl-nginx.conf, which ships with the nginx plugin and this
    # install does not have. TLS 1.2 and 1.3 only; no ssl_dhparam because
    # these suites are all ECDHE and never reach for a DH parameter file.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No HSTS, and not by oversight. HSTS tells every phone that has ever
    # succeeded to refuse plain HTTP to this name for months, and it cannot
    # be withdrawn by editing this file — the instruction is already in the
    # handset. It goes in once the certificate has renewed itself at least
    # once. Until then a broken certificate is an afternoon's problem
    # rather than a fortnight's.

    include snippets/bakery-app.conf;
}

# No redirect from port 80 to HTTPS on the origin. That belongs at Arvan,
# and a redirect here under Flexible mode would loop. Port 80 also has to
# keep answering for the handsets and for certbot's renewal.
