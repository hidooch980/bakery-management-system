# The shop's backend, served by nginx and php-fpm rather than the built-in
# development server, which handles one request at a time and left five
# people on their phones queued behind whoever asked first.
server {
    listen 8000;
    server_name _;

    root /home/ubuntu/bakery-management-system/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Filament ships its own assets; nginx answers for them rather than
    # waking PHP for a stylesheet.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
