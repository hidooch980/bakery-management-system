# The shop's backend, served by nginx and php-fpm rather than the built-in
# development server, which handles one request at a time and left five
# people on their phones queued behind whoever asked first.

# ---------------------------------------------------------------- the name
#
# `baker.molido.ir` over plain HTTP, and the path Let's Encrypt proves the
# name through. There is no TLS in this file, on purpose: nginx refuses to
# start when a `listen ... ssl` block names a certificate that is not
# there, and a server that will not start is the shop shut. The TLS half
# lives in `nginx-bakery-tls.conf` and is installed only once the
# certificate exists — see the HTTPS section of README.md.
server {
    listen 80;

    server_name baker.molido.ir;

    # certbot proves the name by fetching a file from here over plain HTTP,
    # at issue and again at every renewal. This location must keep working
    # after the redirect below is added, or the certificate stops renewing
    # sixty days later — quietly, and on a Friday.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include snippets/bakery-app.conf;
}

# ------------------------------------------------------------------ the IP
#
# Everything that is not the name: the installed handsets. Unchanged, and
# deliberately so. This block retires when `server.json` has pointed at the
# name long enough that every phone has moved — see README.md.
server {
    # 8000 is what the installed phones are built against and must keep
    # answering until they have all moved to a build that does not use it.
    listen 8000 default_server;

    # 80 as well. Iranian mobile networks drop connections to unusual ports,
    # so the shop worked on wifi and failed on Hamrah-e Aval and Irancell —
    # which reads as the server being down when it is answering fine.
    listen 80 default_server;

    server_name _;

    include snippets/bakery-app.conf;
}
