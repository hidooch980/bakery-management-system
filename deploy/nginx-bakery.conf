# The shop's backend, served by nginx and php-fpm rather than the built-in
# development server, which handles one request at a time and left five
# people on their phones queued behind whoever asked first.
server {
    listen 8000;
    server_name _;

    root /home/ubuntu/bakery-management-system/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # nginx turns gzip on globally but leaves gzip_types at its default,
    # which is text/html alone — every API answer was going out uncompressed
    # over a phone connection. The reports are repetitive JSON and give up
    # most of their size.
    #
    # gzip_min_length keeps it off the tiny answers, where the header costs
    # more than the saving.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain
               text/xml application/xml image/svg+xml;

    # Filament ships its own assets; nginx answers for them rather than
    # waking PHP for a stylesheet.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
